<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI Elements -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.4"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }

      .floating-node-1 { animation: floatSlow 5s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: floatReverse 6s ease-in-out infinite; transform-origin: center; }
      .floating-node-3 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .flow-path { stroke-dasharray: 8, 8; animation: dashMove 4s linear infinite; }
      .flow-path-fast { stroke-dasharray: 6, 6; animation: dashMove 2.5s linear infinite; }
      .ambient-glow { animation: glowPulse 4s ease-in-out infinite; }
      .badge-pill { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#0B0F19"/>
  <rect width="1200" height="420" fill="url(#gridPattern)"/>

  <!-- Ambient Dynamic Glows -->
  <circle cx="250" cy="180" r="280" fill="url(#bgGlow1)" class="ambient-glow"/>
  <circle cx="950" cy="240" r="300" fill="url(#bgGlow2)" class="ambient-glow" style="animation-delay: 2s;"/>
  <circle cx="600" cy="200" r="220" fill="url(#bgGlow3)" class="ambient-glow" style="animation-delay: 1s;"/>

  <!-- Dynamic Multi-Agent Graph Connections & Nodes in Background / Flanks -->
  <g opacity="0.75">
    <!-- Connecting flow paths -->
    <path d="M 160 140 Q 300 100 480 180" fill="none" stroke="#6366F1" stroke-width="2" class="flow-path" opacity="0.6"/>
    <path d="M 180 310 Q 340 330 480 240" fill="none" stroke="#06B6D4" stroke-width="2" class="flow-path-fast" opacity="0.6"/>
    <path d="M 720 180 Q 900 110 1040 150" fill="none" stroke="#8B5CF6" stroke-width="2" class="flow-path" opacity="0.6"/>
    <path d="M 720 240 Q 880 340 1020 300" fill="none" stroke="#10B981" stroke-width="2" class="flow-path-fast" opacity="0.6"/>
    <path d="M 1040 150 L 1020 300" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <path d="M 160 140 L 180 310" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

    <!-- Left Flank Agent Nodes -->
    <g class="floating-node-1" transform="translate(160, 140)">
      <circle r="36" fill="#1E293B" stroke="#6366F1" stroke-width="2.5" filter="url(#shadowFilter)"/>
      <circle r="46" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3" class="ambient-glow"/>
      <text x="0" y="-6" fill="#A5B4FC" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🤖 Agent</text>
      <text x="0" y="14" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Planner</text>
    </g>

    <g class="floating-node-2" transform="translate(180, 310)">
      <circle r="34" fill="#1E293B" stroke="#06B6D4" stroke-width="2.5" filter="url(#shadowFilter)"/>
      <circle r="44" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.3" class="ambient-glow"/>
      <text x="0" y="-6" fill="#67E8F9" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚙️ Tool</text>
      <text x="0" y="14" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Executor</text>
    </g>

    <!-- Right Flank Agent Nodes -->
    <g class="floating-node-3" transform="translate(1040, 150)">
      <circle r="36" fill="#1E293B" stroke="#8B5CF6" stroke-width="2.5" filter="url(#shadowFilter)"/>
      <circle r="46" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3" class="ambient-glow"/>
      <text x="0" y="-6" fill="#D8B4FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🧠 LLM</text>
      <text x="0" y="14" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Reasoning</text>
    </g>

    <g class="floating-node-1" transform="translate(1020, 300)">
      <circle r="34" fill="#1E293B" stroke="#10B981" stroke-width="2.5" filter="url(#shadowFilter)"/>
      <circle r="44" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3" class="ambient-glow"/>
      <text x="0" y="-6" fill="#6EE7B7" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🛡️ Guard</text>
      <text x="0" y="14" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Policy/RBAC</text>
    </g>
  </g>

  <!-- Central Foreground Content (Guaranteed crisp and unobstructed) -->
  <g filter="url(#shadowFilter)">
    <!-- Top Super-Tag Pill -->
    <g transform="translate(600, 75)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1E293B" stroke="url(#brandGrad)" stroke-width="1.8"/>
      <circle cx="-160" cy="0" r="5" fill="#10B981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-145" y="5" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM DIRECTORY</text>
      <rect x="110" y="-9" width="55" height="18" rx="9" fill="#4F46E5"/>
      <text x="137" y="4" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2026</text>
    </g>

    <!-- Main Repository Title -->
    <text x="600" y="160" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Multi-Agent System Builders
    </text>

    <!-- Subtitle -->
    <text x="600" y="204" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="500" text-anchor="middle">
      Visual Orchestration Platforms, Low-Code Builders &amp; Cross-Cloud Multi-Agent Frameworks
    </text>

    <!-- Decorative Divider Line with Accent Diamond -->
    <path d="M 380 230 L 570 230 M 630 230 L 820 230" stroke="#334155" stroke-width="1.5"/>
    <circle cx="600" cy="230" r="4" fill="#38BDF8"/>
  </g>

  <!-- Feature Pills / Badges in Foreground Footer -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Visual Orchestration -->
    <g transform="translate(-360, 0)" class="badge-pill">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
      <text x="0" y="5" fill="#BAE6FD" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✨ Visual Orchestration</text>
    </g>

    <!-- Pill 2: Open Source & SaaS -->
    <g transform="translate(-120, 0)" class="badge-pill">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" opacity="0.95"/>
      <text x="0" y="5" fill="#C7D2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ SaaS + Open Source</text>
    </g>

    <!-- Pill 3: Autonomous Swarms -->
    <g transform="translate(120, 0)" class="badge-pill">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="1.2" opacity="0.95"/>
      <text x="0" y="5" fill="#DDD6FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤝 Agent Collaboration</text>
    </g>

    <!-- Pill 4: Zero Vendor Lock-in -->
    <g transform="translate(360, 0)" class="badge-pill">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.2" opacity="0.95"/>
      <text x="0" y="5" fill="#A7F3D0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔓 Zero Vendor Lock-In</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#brandGrad)"/>
</svg>
